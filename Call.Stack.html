<!DOCTYPE html>
<html>

<head>
    <title>Call Stack</title>
</head>
<body>
    <h2>Call Stack</h2>
    <p id="demo"></p>
    <script>
        function add(a, b){
            return a+b;
        }
        function average(a,b){
            return add(a, b)/2;
        }
        var result=average(19, 63);
        document.getElementById("demo").innerHTML=result;
    </script>
</body>
</html>
